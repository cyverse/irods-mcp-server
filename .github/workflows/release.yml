name: Release iRODS MCP Server

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release:
    name: Package binaries and container image
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: cyverse/irods-mcp-server
      # The release tag (e.g., v0.3.0) is used as the version.
      VERSION: ${{ github.ref_name }}
      # Secrets cannot be referenced directly from an `if` expression. This
      # resolves to the string "true" only when both publish credentials exist.
      PUSH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release packages
        shell: bash
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            make release GOOS=linux GOARCH="${arch}" VERSION="${VERSION}" GIT_COMMIT="${GITHUB_SHA}"
            mv "irods-mcp-server-linux-${arch}.tar.gz" dist/
          done

      - name: Attach release packages to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ env.PUSH_IMAGE == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.VERSION }}
            GIT_COMMIT=${{ github.sha }}
          push: ${{ env.PUSH_IMAGE }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
